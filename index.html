const name=(v,lang)=>typeof v==='string'?v:v[lang]||v.en;const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function row(item,lang,t){const n=esc(name(item.n,lang)),sub=item.sub?`<small>${esc(name(item.sub,lang))}</small>`:'',note=item.note?`<small>${esc(t[item.note])}</small>`:'',price=item.p?esc(item.p):`<span class="tbc">${esc(t.tbc)}</span>`;return `<div class="row"><span class="name">${n}${sub}${note}</span><strong>${price}</strong></div>`}
function rows(items,lang,t,two=true){return `<div class="rows${two?' two':''}">${items.map(x=>row(x,lang,t)).join('')}</div>`}
function render(lang){const t=T[lang]||T.en;document.documentElement.lang=lang==='cs'?'cs':lang;document.getElementById('brandPlace').textContent=t.brandPlace;document.getElementById('kicker').textContent=t.kicker;document.getElementById('heroA').textContent=t.hero[0];document.getElementById('heroB').textContent=t.hero[1];for(const [id,val] of [['lead',t.lead],['prices',t.prices],['order',t.order],['atWindow',t.atWindow],['bridge',t.bridge],['stampText',t.stamp],['footerEyebrow',t.footerEye],['seeYou',t.seeYou],['tbcNote',t.tbcNote],['directions',t.directions],['website',t.website],['topText',t.top]])document.getElementById(id).textContent=val;document.querySelectorAll('.lang').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.getElementById('jump').innerHTML=menu.map((s,i)=>`<a href="#${s.id}"><i>${String(i+1).padStart(2,'0')}</i>${esc(t.cats[i])}</a>`).join('');document.getElementById('sections').innerHTML=menu.map((s,i)=>{let body='';if(s.type==='coffee'){body=`<div class="coffee-grid">${coffee.groups.map(([k,items])=>`<div class="group"><h3>${esc(t.groups[k])}</h3>${rows(items,lang,t,false)}</div>`).join('')}</div><div class="extras"><div class="extras-head"><strong>${esc(t.groups.make)}</strong><span>${esc(t.groups.extras)}</span></div>${rows(coffee.extras,lang,t,true)}</div>`}else if(s.type==='seasonal'){body=`<p class="intro">${esc(t.seasonIntro)}</p><span class="season-label">${esc(t.available)}</span><div class="group"><h3>${esc(t.groups.autumn)}</h3>${rows(s.items,lang,t,true)}</div><div class="group" hidden><h3>${esc(t.groups.spring)}</h3>${rows(s.summer,lang,t,true)}</div>`}else body=rows(s.items,lang,t,s.items.length>4);return `<section class="section${s.type==='seasonal'?' seasonal':''}" id="${s.id}"><div class="section-head"><span class="num">${String(i+1).padStart(2,'0')}</span><div><p class="eyebrow">${esc(t.eyes[i])}</p><h2>${esc(t.titles[i])}</h2></div></div>${body}</section>`}).join('');try{localStorage.setItem('claudia-menu-lang',lang)}catch(_){}}
let lang='en';try{const saved=localStorage.getItem('claudia-menu-lang');if(T[saved])lang=saved;else{const b=(navigator.language||'').toLowerCase();if(b.startsWith('cs'))lang='cs';else if(b.startsWith('fr'))lang='fr'}}catch(_){}render(lang);document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>render(b.dataset.lang)));document.getElementById('year').textContent=new Date().getFullYear();const topBtn=document.getElementById('topBtn'),show=()=>topBtn.classList.toggle('show',scrollY>520);show();addEventListener('scroll',show,{passive:true});topBtn.addEventListener('click',()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
</script>
